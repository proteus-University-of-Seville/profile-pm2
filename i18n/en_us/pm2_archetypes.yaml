archetype.tooltip.pattern: "Replace the texts in italics between brackets."
archetype.tooltip.risk-pattern: "Because of (condition), it might be that (event), which will lead to (impact). Replace the texts in italics."
archetype.tooltip.estimated-effort: "High level estimate in person-days."
archetype.tooltip.approving-authority: "Decision maker according to the governance structure of the organisation."
archetype.tooltip.validation: "Assumptions are taken as facts but must be validated; unvalidated assumptions may become risks."
archetype.tooltip.document-location: "Where the latest version of this controlled document is stored."
archetype.tooltip.refines: "Object of a previous artefact that this one refines (e.g. a success criterion of the Project Initiation Request refined in the Business Case)."
archetype.tooltip.critical: "Without it, the project cannot be considered a success."
archetype.tooltip.chosen: "The alternative recommended and described in the solution."
archetype.tooltip.first-year: "Year of the first column of the cost tables; costs are given for 5 years."
archetype.tooltip.need-priority: "Relative importance of the need from the point of view of the stakeholders: essential needs must be addressed, desirable ones should be."
archetype.tooltip.feature: "High level capability of an output: what is needed and why, not how it will be implemented."
archetype.tooltip.perceived-problems: "Key problems that the stakeholder perceives and that the solution should address."
archetype.tooltip.cost-nature: "Staff costs are given in full-time equivalents (FTE), other costs in thousands of euros (k€)."

